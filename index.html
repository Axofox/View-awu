<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlackBulls AWU Tracker</title>
<style>
  :root{--bg:#0b0f12;--panel:#12181d;--line:#1f2a31;--text:#e6edf0;--muted:#8a9aa3;--accent:#2dd4bf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:24px 16px}
  h1{margin:0;font-size:22px} h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:2px 0 16px}
  .bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;min-width:220px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .count{color:var(--muted)}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:760px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;user-select:none}
  th:hover,th[aria-sort]:not([aria-sort=none]){color:var(--accent)}
  tr:last-child td{border-bottom:0}
  td.num{font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:600}
  .badge.r5{background:var(--accent);color:#04201c}
  .msg{padding:24px;color:var(--muted)} .err{color:#f87171}
  button{background:var(--accent);color:#04201c;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>BlackBulls <span>[AWU]</span></h1>
  <p class="sub">Kingshot · Kingdom 2206 · Alliance tracker</p>
  <div class="bar">
    <label class="sr" for="q" style="position:absolute;left:-9999px">Filter members</label>
    <input id="q" type="search" placeholder="Filter by name">
    <span class="count" id="count"></span>
    <button id="refresh">Refresh</button>
  </div>
  <div class="wrap"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"><tr><td class="msg">Loading members…</td></tr></tbody>
  </table></div>
</main>
<script>
const COLS = [
  {k:"name",   label:"Name"},
  {k:"rank",   label:"Rank",  num:true},
  {k:"power",  label:"Power", num:true},
  {k:"tc",     label:"TC",    num:true},
  {k:"vip",    label:"VIP",   num:true},
  {k:"active", label:"Last active", num:true},
  {k:"coords", label:"Coords"},
];
// MightPulse field names are not verified, so try several likely keys.
const pick = (o, keys) => { for (const k of keys) if (o[k] != null) return o[k]; return null; };
function normalize(m){
  const x = m.x ?? m.coord_x, y = m.y ?? m.coord_y;
  return {
    uid: pick(m, ["uid","id","player_id","playerId"]),
    name: pick(m, ["name","nickname","player_name","playerName"]) ?? "?",
    rank: Number(String(pick(m, ["rank","alliance_rank","allianceRank","role"]) ?? "").replace(/\D/g,"")) || null,
    power: Number(pick(m, ["power","total_power","totalPower"])) || 0,
    tc: Number(pick(m, ["tc_level","tcLevel","tc","town_center","furnace_level","level"])) || null,
    vip: Number(pick(m, ["vip","vip_level","vipLevel"])) || null,
    active: pick(m, ["last_active","lastActive","last_seen","lastSeen"]),
    coords: m.coords ?? m.coordinates ?? (x != null && y != null ? `${x}, ${y}` : null),
  };
}
function parseActive(v){ if(v==null) return null; const t = typeof v==="number" ? (v<1e12?v*1000:v) : Date.parse(v); return isNaN(t)?null:t; }
function ago(t){
  if(t==null) return "-";
  const s = Math.max(0,(Date.now()-t)/1000);
  for (const [n,u] of [[86400,"d"],[3600,"h"],[60,"m"]]) if (s>=n) return Math.floor(s/n)+u+" ago";
  return "just now";
}
const fmt = n => n ? n.toLocaleString() : "-";

let rows = [], sort = {k:"power", dir:-1};
const $ = id => document.getElementById(id);

function renderHead(){
  $("head").innerHTML = COLS.map(c => {
    const s = sort.k===c.k ? (sort.dir>0?"ascending":"descending") : "none";
    return `<th data-k="${c.k}" aria-sort="${s}">${c.label}${s==="none"?"":s==="ascending"?" ▲":" ▼"}</th>`;
  }).join("");
}
function val(r,k){ return k==="active" ? parseActive(r.active) : r[k]; }
function render(){
  const q = $("q").value.trim().toLowerCase();
  const list = rows.filter(r => r.name.toLowerCase().includes(q)).sort((a,b) => {
    const x = val(a,sort.k), y = val(b,sort.k);
    if (x==null && y==null) return 0; if (x==null) return 1; if (y==null) return -1;
    return (x>y?1:x<y?-1:0)*sort.dir;
  });
  $("count").textContent = `${list.length} of ${rows.length} members`;
  $("body").innerHTML = list.length ? list.map(r => `<tr>
    <td>${esc(r.name)}</td>
    <td>${r.rank?`<span class="badge${r.rank===5?" r5":""}">R${r.rank}</span>`:"-"}</td>
    <td class="num">${fmt(r.power)}</td>
    <td class="num">${r.tc??"-"}</td>
    <td class="num">${r.vip??"-"}</td>
    <td>${ago(parseActive(r.active))}</td>
    <td>${esc(r.coords??"-")}</td></tr>`).join("")
    : `<tr><td class="msg">No members match.</td></tr>`;
  renderHead();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  $("body").innerHTML = `<tr><td class="msg">Loading members…</td></tr>`;
  try{
    const res = await fetch("/api/members");
    if(!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.members ?? data.data ?? []);
    rows = list.map(normalize);
    render();
  }catch(e){
    $("body").innerHTML = `<tr><td class="msg err">Couldn't load members (${esc(e.message)}). Try Refresh.</td></tr>`;
  }
}
$("head").addEventListener("click", e => {
  const th = e.target.closest("th"); if(!th) return;
  const k = th.dataset.k;
  sort = sort.k===k ? {k, dir:-sort.dir} : {k, dir: k==="name"||k==="coords"?1:-1};
  render();
});
$("q").addEventListener("input", render);
$("refresh").addEventListener("click", load);
renderHead(); load();
</script>
</body>
</html>
