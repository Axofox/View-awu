[build]
  publish = "public"
  functions = "netlify/functions"

# /api/history is served by its own function (see netlify/functions/history.mts).
[[redirects]]
  from = "/api/members"
  to = "/.netlify/functions/proxy/members"
  status = 200

[[redirects]]
  from = "/api/gear"
  to = "/.netlify/functions/proxy/gear"
  status = 200
