<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlackBulls AWU Tracker</title>
<style>
  :root{--bg:#0b0f12;--panel:#12181d;--line:#1f2a31;--text:#e6edf0;--muted:#8a9aa3;--accent:#2dd4bf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:24px 16px}
  h1{margin:0;font-size:22px} h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:2px 0 16px}
  .bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;min-width:220px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .count{color:var(--muted)}
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:760px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;user-select:none}
  th:hover,th[aria-sort]:not([aria-sort=none]){color:var(--accent)}
  tr:last-child td{border-bottom:0}
  td.num{font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-size:12px;font-weight:600}
  .badge.r5{background:var(--accent);color:#04201c}
  button.name{background:none;color:var(--text);padding:0;font:inherit;font-weight:600;text-align:left}
  button.name::before{content:"▸ ";color:var(--accent)}
  button.name[aria-expanded=true]::before{content:"▾ "}
  button.name:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  tr.detail td{white-space:normal;background:var(--bg);padding:14px 16px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:calc(100vw - 66px)}
  .detail h2{margin:0 0 6px;font-size:13px;color:var(--accent);font-weight:600}
  .detail ul{margin:4px 0 10px;padding-left:18px} .detail li{margin:2px 0}
  .detail p{margin:0} .hero{margin-bottom:6px}
  td.up{color:var(--accent)} td.down{color:#f87171}
  .detail section h2:not(:first-child){margin-top:14px}
  .q{color:var(--muted);font-size:13px}
  .gid{margin:0 0 12px;color:var(--muted);font-size:13px} .gid b{color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  button.copy{background:none;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:6px;font-size:12px;margin-left:6px}
  button.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .log{margin-top:24px} .log h2{font-size:16px;margin:0 0 8px}
  .log ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .log li{padding:10px 12px;border-bottom:1px solid var(--line)} .log li:last-child{border-bottom:0}
  .log .day{color:var(--muted);font-size:13px;margin-bottom:2px}
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;border-radius:4px;margin-right:6px}
  .tag.in{color:#04201c;background:var(--accent)} .tag.out{color:#fff;background:#b91c1c} .tag.rk{color:var(--accent);border:1px solid var(--accent)}
  .new{font-size:11px;font-weight:600;color:var(--accent);margin-left:6px;vertical-align:1px} .q.red{color:#f87171}
  .updated{color:var(--muted);font-size:13px;flex-basis:100%}
  button:disabled{opacity:.6;cursor:progress}
  .hint{color:var(--muted);font-size:13px;margin:8px 2px}
  button.tip{width:18px;height:18px;border-radius:50%;padding:0;margin-left:6px;vertical-align:1px;
    font:600 11px/16px system-ui,sans-serif;color:var(--muted);background:none;border:1px solid var(--line)}
  button.tip.grew{color:#04201c;background:var(--accent);border-color:var(--accent)}
  button.tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #tip{position:fixed;z-index:10;max-width:260px;padding:10px 12px;border-radius:8px;background:var(--panel);
    border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.45);font-size:13px;line-height:1.5}
  #tip[hidden]{display:none} #tip b{color:var(--text)} #tip .up{color:var(--accent)} #tip .down{color:#f87171}
  .msg{padding:24px;color:var(--muted)} .err{color:#f87171}
  button{background:var(--accent);color:#04201c;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>BlackBulls <span>[AWU]</span></h1>
  <p class="sub" id="sub">Kingshot · Kingdom 2206 · Alliance tracker</p>
  <div class="bar">
    <label class="sr" for="q" style="position:absolute;left:-9999px">Filter members</label>
    <input id="q" type="search" placeholder="Filter by name or game ID">
    <span class="count" id="count"></span>
    <button id="refresh">Refresh</button>
    <span class="updated" id="updated" aria-live="polite"></span>
  </div>
  <p class="hint" id="hint">Select a name for hero gear and history. The circle next to a name shows what grew in the last 7 days.</p>
  <div class="wrap"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"><tr><td class="msg">Loading members…</td></tr></tbody>
  </table></div>
  <section class="log" aria-labelledby="log-h">
    <h2 id="log-h">Member log</h2>
    <div id="log"><p class="q">Loading…</p></div>
  </section>
</main>
<div id="tip" role="tooltip" hidden></div>
<script>
const COLS = [
  {k:"name",   label:"Name"},
  {k:"rank",   label:"Rank",  num:true},
  {k:"power",  label:"Power", num:true},
  {k:"tc",     label:"TC",    num:true},
  {k:"vip",    label:"VIP",   num:true},
  {k:"kills",  label:"Kills",  num:true},
  {k:"growth", label:"Growth", num:true},
  {k:"gear",   label:"Hero gear", num:true},
  {k:"gearGrowth", label:"Gear growth", num:true},
  {k:"coords", label:"Coords"},
];
// MightPulse field names are not verified, so try several likely keys.
const pick = (o, keys) => { for (const k of keys) if (o[k] != null) return o[k]; return null; };
function normalize(m){
  const x = m.x ?? m.coord_x, y = m.y ?? m.coord_y;
  return {
    uid: String(pick(m, ["governor_id","uid","id"])),
    name: pick(m, ["nick_name","name","nickname","player_name","playerName"]) ?? "?",
    rank: Number(String(pick(m, ["alliance_rank_label","alliance_rank","rank_label","rank","role"]) ?? "").replace(/\D/g,"")) || null,
    power: Number(pick(m, ["power","total_power","totalPower"])) || 0,
    tc: Number(pick(m, ["town_center_level","tc_level","tcLevel","tc","level"])) || null,
    vip: Number(pick(m, ["vip","vip_level","vipLevel"])) || null,
    kills: Number(m.kills) || null,
    gov: null, heroes: [], gear: null, // filled in by loadGear()
    growth: null, gearGrowth: null, points: [], // filled in by loadHistory()
    coords: m.coords ?? m.coordinates ?? (x != null && y != null ? `${x}, ${y}` : null),
  };
}
function parseActive(v){ if(v==null) return null; const t = typeof v==="number" ? (v<1e12?v*1000:v) : Date.parse(v); return isNaN(t)?null:t; }
function ago(t){
  if(t==null) return "-";
  const s = Math.max(0,(Date.now()-t)/1000);
  for (const [n,u] of [[86400,"d"],[3600,"h"],[60,"m"]]) if (s>=n) return Math.floor(s/n)+u+" ago";
  return "just now";
}
// Levels above 30 are Truegold tiers: 35 = TG1, 40 = TG2, and so on.
function tcLabel(n){
  if(!n) return "-";
  if(n<=30) return String(n);
  const tier=Math.floor((n-30)/5), step=(n-30)%5;
  return (tier?`TG${tier}`:"30")+(step?`-${step}`:"");
}
const fmt = n => n ? n.toLocaleString() : "-";

let rows = [], sort = {k:"power", dir:-1};
const $ = id => document.getElementById(id);

function renderHead(){
  $("head").innerHTML = COLS.map(c => {
    const s = sort.k===c.k ? (sort.dir>0?"ascending":"descending") : "none";
    return `<th data-k="${c.k}" aria-sort="${s}">${c.label}${s==="none"?"":s==="ascending"?" ▲":" ▼"}</th>`;
  }).join("");
}
function val(r,k){ return r[k]; }
function render(){
  hideTip();
  const q = $("q").value.trim().toLowerCase();
  const list = rows.filter(r => r.name.toLowerCase().includes(q) || r.uid.includes(q)).sort((a,b) => {
    const x = val(a,sort.k), y = val(b,sort.k);
    if (x==null && y==null) return 0; if (x==null) return 1; if (y==null) return -1;
    return (x>y?1:x<y?-1:0)*sort.dir;
  });
  $("count").textContent = `${list.length} of ${rows.length} members`;
  $("body").innerHTML = list.length ? list.map(r => `<tr>
    <td><button class="name" aria-expanded="${open.has(r.uid)}" data-uid="${esc(r.uid)}">${esc(r.name)}</button>${historyLoaded?`<button class="tip${weekGrew(r)?" grew":""}" data-tip="${esc(r.uid)}" aria-label="What grew in the last 7 days for ${esc(r.name)}">${weekGrew(r)?"↑":"i"}</button>`:""}${r.joined?`<span class="new" title="Joined ${esc(r.joined)}">NEW</span>`:""}</td>
    <td>${r.rank?`<span class="badge${r.rank===5?" r5":""}">R${r.rank}</span>`:"-"}</td>
    <td class="num">${fmt(r.power)}</td>
    <td class="num">${tcLabel(r.tc)}</td>
    <td class="num">${r.vip??"-"}</td>
    <td class="num">${fmt(r.kills)}</td>
    <td class="num${r.growth>0?" up":r.growth<0?" down":""}">${r.growth==null?"-":signed(r.growth)}</td>
    <td class="num">${r.gear!=null?"+"+r.gear:!r.gov&&gearState==="loading"?"…":"-"}</td>
    <td class="num${r.gearGrowth>0?" up":r.gearGrowth<0?" down":""}">${r.gearGrowth==null?"-":signed(r.gearGrowth)}</td>
    <td>${esc(r.coords??"-")}</td></tr>${open.has(r.uid)?detail(r):""}`).join("")
    : `<tr><td class="msg">No members match.</td></tr>`;
  renderHead();
}
function detail(r){
  if(!r.gov) return `<tr class="detail"><td colspan="${COLS.length}"><p class="q">${
    gearState==="loading" ? "Loading gear…" : "Gear isn't available for this member right now. Try Refresh."}</p></td></tr>`;
  const gov = r.gov.items.length
    ? `<ul>${r.gov.items.map(i => `<li><b>${esc(i.slot)}</b> ${esc(i.name)} <span class="q">${esc(i.tier??"")}${i.star?` ${i.star}★`:""} · Lv ${i.level??"-"} · ${fmt(i.score)}</span></li>`).join("")}</ul>`
    : `<p class="q">${r.gov.hidden ? "This player hides their governor gear in game." : "No governor gear on record."}</p>`;
  const heroes = r.heroes.length
    ? r.heroes.map(h => `<div class="hero"><b>${esc(h.name)}</b> <span class="q">Lv ${h.level??"-"}${h.stars?` · ${esc(h.stars)}`:""}${h.exclusive?` · ${esc(h.exclusive.name)} Lv ${h.exclusive.level}`:""}</span>
        ${h.gear.length?`<ul>${h.gear.map(g => `<li><b>${esc(g.slot)}</b> ${esc(g.name)} <span class="q${g.red?" red":""}">${esc(g.quality??"")} +${g.level??0}${g.refine?` · mastery ${g.refine}`:""}</span></li>`).join("")}</ul>`:""}</div>`).join("")
    : `<p class="q">No arena heroes on record.</p>`;
  const hist = r.points.length
    ? `<ul>${r.points.slice(-8).reverse().map((p,i,a) => { const prev=a[i+1];
        const gd = prev && p[2]!=null && prev[2]!=null ? Math.round((p[2]-prev[2])*10)/10 : null;
        return `<li><b>${esc(p[0])}</b> ${fmt(p[1])}${prev?` <span class="q">${signed(p[1]-prev[1])}</span>`:""}`
          + `${p[2]!=null?` <span class="q">· gear +${p[2]}${gd?` (${signed(gd)})`:""}</span>`:""}</li>`; }).join("")}</ul>`
    : `<p class="q">No power history yet. It's recorded once a day from now on.</p>`;
  return `<tr class="detail"><td colspan="${COLS.length}">
    <p class="gid">Game ID <b>${esc(r.uid)}</b> <button class="copy" data-copy="${esc(r.uid)}">Copy</button></p>
    <div class="cols">
    <section><h2>Hero gear (arena team)</h2>${heroes}</section>
    <section><h2>Power history</h2>${hist}<h2>Governor gear</h2>${gov}</section></div></td></tr>`;
}
const open = new Set();
let gearState = "idle";
// Member log: joins, departures and rank changes found between daily snapshots.
function renderLog(log, byId){
  const weekAgo = new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  for (const e of log) if (e.date >= weekAgo) for (const j of e.joined) { const r = byId.get(String(j.id)); if (r && !r.joined) r.joined = e.date; }
  const name = w => `<b>${esc(w.name ?? w.id)}</b> <span class="q">${fmt(w.power)}</span>`;
  $("log").innerHTML = log.length
    ? `<ol>${log.map(e => `<li><div class="day">${esc(e.date)} <span class="q">(since ${esc(e.since)})</span></div>`
        + e.joined.map(w => `<div><span class="tag in">Joined</span>${name(w)}</div>`).join("")
        + e.left.map(w => `<div><span class="tag out">Left</span>${name(w)}</div>`).join("")
        + e.rank.map(w => `<div><span class="tag rk">${w.to > w.from ? "Promoted" : "Demoted"}</span>${name(w)} <span class="q">R${w.from} → R${w.to}</span></div>`).join("")
        + `</li>`).join("")}</ol>`
    : `<p class="q">No changes yet. Members who join, leave or change rank will be listed here, checked once a day.</p>`;
}
// 7-day summary for the circle next to each name: compares the oldest snapshot in
// the last 7 days with the newest one, for every metric both snapshots have.
let historyLoaded = false;
function weekSummary(r, cutoff){
  const pts = r.points.filter(p => p[0] >= cutoff);
  if (pts.length < 2) return null;
  const first = i => pts.find(p => p[i]!=null), last = i => [...pts].reverse().find(p => p[i]!=null);
  const diff = i => { const a=first(i), b=last(i); return a && b && a!==b ? Math.round((b[i]-a[i])*10)/10 : null; };
  const t0 = first(3), t1 = last(3);
  return { since: pts[0][0], power: diff(1), gear: diff(2), kills: diff(4), gov: diff(5),
           tc: t0 && t1 && t0!==t1 && t1[3]!==t0[3] ? [t0[3], t1[3]] : null };
}
const weekGrew = r => !!r.week && ["power","gear","kills","gov"].some(k => r.week[k] > 0) || !!(r.week && r.week.tc);
const compact = n => { const a=Math.abs(n); return a>=1e9?(n/1e9).toFixed(1)+"B":a>=1e6?(n/1e6).toFixed(1)+"M":a>=1e4?Math.round(n/1e3)+"k":n.toLocaleString(); };
function weekText(r){
  const w = r.week;
  if (!w) return `<b>${esc(r.name)}</b><br><span class="q">Not enough history yet. This fills in after two daily snapshots.</span>`;
  const line = (label, v, unit="") => v ? `<div>${label} <span class="${v>0?"up":"down"}">${v>0?"+":"−"}${compact(Math.abs(v))}${unit}</span></div>` : "";
  const body = line("Power", w.power)
    + line("Hero gear", w.gear, w.gear && Math.abs(w.gear)===1 ? " level" : " levels")
    + line("Governor gear", w.gov, " score")
    + (w.tc ? `<div>Town Center <span class="up">${tcLabel(w.tc[0])} → ${tcLabel(w.tc[1])}</span></div>` : "")
    + line("Kills", w.kills);
  return `<b>${esc(r.name)}</b> <span class="q">since ${esc(w.since)}</span>` + (body || `<div class="q">No change in the last 7 days.</div>`);
}
// One shared tooltip, positioned next to the circle: hover or focus on desktop, tap on phones.
let tipFor = null, tipPinned = false; // pinned = opened by a click or tap
function showTip(btn){
  const r = rows.find(x => x.uid === btn.dataset.tip); if (!r) return;
  const tip = $("tip"); tip.innerHTML = weekText(r); tip.hidden = false; tipFor = btn;
  btn.setAttribute("aria-describedby", "tip");
  const b = btn.getBoundingClientRect(), t = tip.getBoundingClientRect();
  const left = Math.min(Math.max(8, b.left + b.width/2 - t.width/2), innerWidth - t.width - 8);
  const top = b.bottom + 8 + t.height > innerHeight ? b.top - t.height - 8 : b.bottom + 8;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip(){ if (tipFor) tipFor.removeAttribute("aria-describedby"); $("tip").hidden = true; tipFor = null; tipPinned = false; }
const signed = n => (n>0?"+":n<0?"−":"") + Math.abs(n).toLocaleString();
// Power history from the database: growth = latest power minus the oldest
// snapshot within the last 7 days.
async function loadHistory(){
  try{
    const res = await fetch("/api/history");
    if(!res.ok) return;
    const byId = new Map(rows.map(r => [r.uid, r]));
    const cutoff = new Date(Date.now()-7*864e5).toISOString().slice(0,10);
    const data = await res.json();
    for (const m of data.members || []) {
      const r = byId.get(String(m.governor_id)); if(!r) continue;
      const num = v => v==null ? null : Number(v);
      r.points = m.points.map(p => [p[0], Number(p[1]), num(p[2]), num(p[3]), num(p[4]), num(p[5])]);
      r.week = weekSummary(r, cutoff);
      const base = r.points.find(p => p[0] >= cutoff);
      const last = r.points[r.points.length-1];
      if (base && base !== last) {
        r.growth = (r.power || last[1]) - base[1];
        const gb = r.points.find(p => p[0] >= cutoff && p[2]!=null);
        if (gb && gb !== last && last[2]!=null) r.gearGrowth = Math.round((last[2]-gb[2])*10)/10;
      }
    }
    renderLog(data.log || [], byId);
    historyLoaded = true;
    render();
  }catch(e){ /* table stays usable without history */ }
}
// Second step: VIP, coordinates, governor gear and heroes, 50 members per request.
async function loadGear(force){
  gearState = "loading"; gearAt = null; render();
  const ids = rows.map(r => r.uid).filter(id => /^\d+$/.test(id));
  const chunks = []; for (let i=0;i<ids.length;i+=50) chunks.push(ids.slice(i,i+50));
  await Promise.all(chunks.map(async c => {
    try{
      const res = await fetch("/api/gear?ids=" + c.join(",") + (force ? "&fresh=1" : ""));
      if(!res.ok) return;
      const players = (await res.json()).players || [];
      const byId = new Map(rows.map(r => [r.uid, r]));
      for (const p of players) {
        const r = byId.get(String(p.governor_id)); if(!r) continue;
        if (p.cached_at && (!gearAt || p.cached_at < gearAt)) gearAt = p.cached_at;
        r.vip = p.vip ?? null;
        r.coords = p.x!=null && p.y!=null ? `${p.x}, ${p.y}` : null;
        r.gov = p.gov_gear; r.heroes = p.heroes || [];
        // Hero gear column: average upgrade level across the arena team's gear pieces.
        const pieces = r.heroes.flatMap(h => h.gear);
        r.gear = pieces.length ? Math.round(pieces.reduce((t,g)=>t+(g.level||0),0)/pieces.length*10)/10 : null;
      }
    }catch(e){ /* table stays usable without gear */ }
    render();
  }));
  gearState = "done"; render();
}

// "Updated" line: how old MightPulse's data is, and when this page last checked.
let rosterAt = null, gearAt = null, checkedAt = null, loading = false;
function showUpdated(){
  if (loading) { $("updated").textContent = "Refreshing from MightPulse… this can take up to 30 seconds."; return; }
  if (!checkedAt) { $("updated").textContent = ""; return; }
  const parts = [];
  if (rosterAt) parts.push(`Power updated ${ago(parseActive(rosterAt))}`);
  if (gearAt) parts.push(`gear ${ago(parseActive(gearAt))}`);
  parts.push(`checked ${checkedAt.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}`);
  $("updated").textContent = parts.join(" · ");
}
setInterval(showUpdated, 60000);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(force){
  const btn = $("refresh");
  btn.disabled = true; btn.textContent = force ? "Refreshing…" : "Loading…";
  loading = !!force; showUpdated();
  if (!rows.length) $("body").innerHTML = `<tr><td class="msg">Loading members…</td></tr>`;
  // On Refresh the members are already known, so gear starts at the same time.
  const early = force && rows.length ? loadGear(true) : null;
  try{
    const res = await fetch("/api/members" + (force ? "?fresh=1" : ""));
    if(!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    const list = Array.isArray(data) ? data : (data.members ?? data.data ?? []);
    // Keep gear and history already shown until the new copies arrive.
    const prev = new Map(rows.map(r => [r.uid, r]));
    rows = list.map(normalize).map(r => {
      const o = prev.get(r.uid);
      return o ? {...r, vip:o.vip, coords:o.coords, gov:o.gov, heroes:o.heroes, gear:o.gear, growth:o.growth, points:o.points} : r;
    });
    rosterAt = data.cached_at ?? null;
    const a = data.alliance;
    if (a) $("sub").textContent = `Kingshot · Kingdom 2206 · ${fmt(a.power)} power · kingdom rank #${a.power_rank}`;
    render();
    await Promise.all([early || loadGear(force), loadHistory()]);
    checkedAt = new Date();
  }catch(e){
    if (!rows.length) $("body").innerHTML = `<tr><td class="msg err">Couldn't load members (${esc(e.message)}). Try Refresh.</td></tr>`;
    else $("updated").textContent = `Couldn't refresh (${e.message}). Showing the last data. Try again in a minute.`;
    loading = false; btn.disabled = false; btn.textContent = "Refresh";
    return;
  }
  loading = false; btn.disabled = false; btn.textContent = "Refresh";
  showUpdated();
}
$("head").addEventListener("click", e => {
  const th = e.target.closest("th"); if(!th) return;
  const k = th.dataset.k;
  sort = sort.k===k ? {k, dir:-sort.dir} : {k, dir: k==="name"||k==="coords"?1:-1};
  render();
});
$("body").addEventListener("click", async e => {
  const c = e.target.closest("button.copy");
  if (c) {
    try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent = "Copied"; }
    catch { c.textContent = "Copy failed"; }
    setTimeout(() => { c.textContent = "Copy"; }, 1500);
    return;
  }
  const t = e.target.closest("button.tip");
  // A tap also fires mouseover first, so only a second click on a pinned tip closes it.
  if (t) { if (tipPinned && tipFor === t) hideTip(); else { showTip(t); tipPinned = true; } return; }
  const b = e.target.closest("button.name"); if(!b) return;
  const id = b.dataset.uid;
  open.has(id) ? open.delete(id) : open.add(id);
  render();
  const again = document.querySelector(`button.name[data-uid="${CSS.escape(id)}"]`);
  if (again) again.focus();
});
$("body").addEventListener("mouseover", e => { const t = e.target.closest("button.tip"); if (t && !tipPinned && tipFor !== t) showTip(t); });
$("body").addEventListener("mouseout", e => { if (!tipPinned && e.target.closest("button.tip") && !e.relatedTarget?.closest?.("button.tip")) hideTip(); });
// Keyboard focus only: a tap also focuses the button and is handled by the click above.
$("body").addEventListener("focusin", e => { const t = e.target.closest("button.tip"); if (t && !tipPinned && t.matches(":focus-visible")) showTip(t); });
$("body").addEventListener("focusout", e => { if (!tipPinned && e.target.closest("button.tip")) hideTip(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
document.addEventListener("click", e => { if (tipFor && !e.target.closest("button.tip")) hideTip(); });
addEventListener("scroll", hideTip, true); addEventListener("resize", hideTip);
$("q").addEventListener("input", render);
$("refresh").addEventListener("click", () => load(true));
renderHead(); load(false);
</script>
</body>
</html>
